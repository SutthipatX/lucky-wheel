<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Wheel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for winning effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #0b0c10;
            color: #e0e6ed;
        }

        /* Custom Dark Neon Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #12131a;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d3d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff2a5f;
        }

        /* Neon Glow Effects */
        .neon-glow-red {
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.4), inset 0 0 15px rgba(255, 42, 95, 0.2);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4), inset 0 0 15px rgba(0, 229, 255, 0.2);
        }
        .neon-border-red {
            border-color: #ff2a5f;
            box-shadow: 0 0 10px rgba(255, 42, 95, 0.5);
        }
        .neon-text-red {
            text-shadow: 0 0 10px rgba(255, 42, 95, 0.7);
        }
        .neon-text-cyan {
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
        }

        /* Pointer Marker Pulsing */
        @keyframes pulse-pointer {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .animate-pointer {
            animation: pulse-pointer 1s infinite ease-in-out;
        }

        /* Canvas Wrapper Aspect Ratio */
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0b0c10] text-gray-200 selection:bg-red-600 selection:text-white">

    <!-- Header Navigation -->
    <header class="bg-[#12141c]/90 backdrop-blur-md border-b border-gray-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-gamepad text-3xl text-[#ff2a5f] animate-spin-slow"></i>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-wider text-white flex items-center gap-2">
                        <span>Lucky Wheel</span>
                    </h1>
                </div>
            </div>

            <!-- Tab Switcher -->
            <div class="flex bg-[#1a1d29] p-1 rounded-xl border border-gray-700 w-full sm:w-auto">
                <button id="tab-custom-btn" onclick="switchTab('custom')" 
                    class="flex-1 sm:flex-none px-5 py-2 rounded-lg font-semibold text-sm transition-all duration-300 flex items-center justify-center gap-2 bg-[#ff2a5f] text-white shadow-lg">
                    <i class="fa-solid fa-pen-to-square"></i> Survivors
                </button>
                <button id="tab-dbd-btn" onclick="switchTab('dbd')" 
                    class="flex-1 sm:flex-none px-5 py-2 rounded-lg font-semibold text-sm text-gray-400 hover:text-white transition-all duration-300 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-skull text-red-500"></i> Killers (45)
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">

        <!-- ================= TAB 1: CUSTOM WHEEL ================= -->
        <section id="tab-custom" class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Wheel Display Column -->
            <div class="lg:col-span-7 flex flex-col items-center bg-[#12141c] p-6 rounded-2xl border border-gray-800 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
                
                <h2 class="text-2xl font-bold text-cyan-400 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-compass"></i> Survivors Wheel
                </h2>

                <!-- Wheel Canvas Container -->
                <div class="wheel-container my-4">
                    <!-- Top Pointer Marker -->
                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-20 animate-pointer filter drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)]">
                        <i class="fa-solid fa-caret-down text-4xl text-[#00e5ff] neon-text-cyan"></i>
                    </div>

                    <canvas id="customCanvas" class="w-full h-full rounded-full cursor-pointer transition-transform duration-100"></canvas>
                    
                    <!-- Center Spin Button -->
                    <button onclick="spinCustomWheel()" id="spin-custom-btn" 
                        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-full border-4 border-[#12141c] text-white font-black text-lg shadow-2xl hover:scale-105 active:scale-95 transition-all flex flex-col items-center justify-center z-10 neon-glow-cyan">
                        <span>หมุน!</span>
                        <i class="fa-solid fa-rotate text-xs mt-0.5"></i>
                    </button>
                </div>

                <!-- Info Bar -->
                <div class="w-full mt-4 flex justify-between items-center text-xs text-gray-400 border-t border-gray-800 pt-3">
                    <span><i class="fa-solid fa-list-ol mr-1"></i> จำนวน: <strong id="custom-count-text" class="text-cyan-400">0</strong> คน</span>
                </div>
            </div>

            <!-- Controls & Input Column -->
            <div class="lg:col-span-5 bg-[#12141c] p-6 rounded-2xl border border-gray-800 shadow-2xl flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-md font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-cyan-400"></i> รายชื่อในวงล้อ
                    </h3>
                    <div class="flex gap-2">
                        <button onclick="shuffleCustomWheel()" class="bg-red-500 hover:bg-red-900 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
    <i class="fa-solid fa-shuffle"></i> สลับ
</button>
                        <button onclick="resetCustomPresets()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg border border-gray-700 transition">
                            <i class="fa-solid fa-rotate-left mr-1"></i> ค่าเริ่มต้น
                        </button>
                        <button onclick="clearCustomList()" class="text-xs bg-red-950/50 hover:bg-red-900/60 text-red-400 px-3 py-1.5 rounded-lg border border-red-800 transition">
                            <i class="fa-solid fa-trash-can mr-1"></i> ล้างทั้งหมด
                        </button>
                    </div>
                </div>

                <p class="text-xs text-gray-400"></p>
                
                <textarea id="custom-items-input" rows="12" 
                    class="w-full bg-[#1a1d29] text-white p-4 rounded-xl border border-gray-700 focus:border-cyan-400 focus:outline-none focus:ring-1 focus:ring-cyan-400 text-sm font-mono resize-y transition shadow-inner"
                    oninput="updateCustomWheelFromTextarea()"></textarea>

                <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-800 text-xs text-gray-400 flex items-start gap-2.5">
                    <i class="fa-solid fa-circle-info text-cyan-400 text-sm mt-0.5"></i>
                </div>
            </div>
        </section>

        <!-- ================= TAB 2: DBD KILLERS WHEEL ================= -->
        <section id="tab-dbd" class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start hidden">
            
            <!-- DbD Wheel Display Column -->
            <div class="lg:col-span-7 flex flex-col items-center bg-[#12141c] p-6 rounded-2xl border border-gray-800 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-24 -right-24 w-48 h-48 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="w-full flex justify-between items-center mb-2">
                    <h2 class="text-2xl font-bold text-red-500 flex items-center gap-2 neon-text-red">
                        <i class="fa-solid fa-skull"></i> KILLER WHEEL
                    </h2>
                    <span class="text-xs px-2.5 py-1 bg-red-950/80 text-red-400 border border-red-800 rounded-full font-mono">
                        45 KILLERS
                    </span>
                </div>

                <!-- Wheel Canvas Container -->
                <div class="wheel-container my-4">
                    <!-- Top Pointer Marker -->
                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-20 animate-pointer filter drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)]">
                        <i class="fa-solid fa-caret-down text-4xl text-[#ff2a5f] neon-text-red"></i>
                    </div>

                    <canvas id="dbdCanvas" class="w-full h-full rounded-full cursor-pointer transition-transform duration-100"></canvas>
                    
                    <!-- Center Spin Button & Live Preview Image -->
            <button onclick="spinDbdWheel()" id="spin-dbd-btn"
             
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 bg-[#12141c] rounded-full border-4 border-[#ff2a5f] shadow-2xl hover:scale-105 active:scale-95 transition-all flex flex-col items-center justify-center overflow-hidden z-10 neon-glow-red group">
                
                <!-- Portrait Preview inside Center Circle -->

                <img id="dbd-center-portrait" src="" 
                    class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-40 transition" alt="Killer Preview">
                
                <div class="relative z-10 text-center flex flex-col items-center drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">
                    <span class="font-black text-white text-base tracking-wider">หมุน!</span>
                    <i class="fa-solid fa-skull text-red-400 text-xs mt-0.5"></i>
                </div>
                
            </button>
        
                </div>

                <!-- Info Note -->
                <div class="w-full mt-4 flex justify-between items-center text-xs text-gray-400 border-t border-gray-800 pt-3">
                    <span class="text-gray-400"><i class="fa-solid fa-shield-halved text-red-400 mr-1"></i></span>
                    <span class="text-red-400 font-mono">ALL 45 KILLERS READY</span>
                </div>
            </div>

            <!-- DbD Killers Directory & Filter Sidebar -->
            <div class="lg:col-span-5 bg-[#12141c] p-6 rounded-2xl border border-gray-800 shadow-2xl flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-md font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-users-slash text-red-500"></i> รายชื่อ Killer ทั้งหมด (45)
                    </h3>
                    <button onclick="shuffleDbdWheel()" class="mt-2 bg-red-500 hover:bg-red-900 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 justify-center w-full">
    <i class="fa-solid fa-shuffle"></i> สลับ
</button>
                </div>

                <!-- Search Input -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
                    <input type="text" id="dbd-search-input" onkeyup="filterDbdList()" 
                        class="w-full bg-[#1a1d29] text-white pl-9 pr-4 py-2.5 rounded-xl border border-gray-700 text-xs focus:border-red-500 focus:outline-none transition"
                        placeholder="ค้นหาชื่อ Killer...">
                </div>

                <!-- Scrollable Grid of 45 Killers -->
                <div id="dbd-killer-grid" class="max-h-[460px] overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-2.5 pr-1">
                    <!-- Dynamic Items will be rendered here by JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800/80 bg-[#0d0e14] py-4 text-center text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
        </div>
    </footer>

    <!-- ================= MODAL RESULT DIALOG ================= -->
    <div id="result-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-all duration-300">
        <div id="modal-card" class="bg-[#161824] border border-gray-700 rounded-3xl max-w-md w-full p-6 text-center transform scale-90 transition-all duration-300 shadow-2xl relative overflow-hidden">
            
            <!-- Glow Accent Background -->
            <div id="modal-glow" class="absolute -top-20 left-1/2 -translate-x-1/2 w-40 h-40 bg-red-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl transition">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-1" id="modal-subtitle">
                ผลการสุ่มวงล้อ
            </div>

            <!-- Winner Title -->
            <h2 id="modal-title" class="text-2xl font-black text-white mb-4">
                RESULT
            </h2>

            <!-- Winner Image (DbD Killer Image Container) -->
            <div id="modal-image-container" class="hidden my-4 relative justify-center items-center">
                <div class="w-44 h-44 rounded-2xl p-1 bg-gradient-to-b from-red-500/80 to-transparent shadow-xl relative overflow-hidden border border-red-500/40">
                    <img id="modal-killer-img" src="" class="w-full h-full object-cover rounded-xl" alt="Winner Portrait">
                </div>
            </div>

            <!-- Winner Display Name -->
            <div id="modal-winner-name" class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-amber-300 to-red-500 my-2 drop-shadow-md">
                -
            </div>

            <!-- Action Buttons for Custom Wheel Mode -->
            <div id="modal-custom-actions" class="mt-6 grid grid-cols-2 gap-3 hidden">
                <button onclick="handleModalRemoveChoice(true)" 
                    class="py-2.5 px-4 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-sm shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> เอาออก
                </button>
                <button onclick="handleModalRemoveChoice(false)" 
                    class="py-2.5 px-4 rounded-xl bg-gray-700 hover:bg-gray-600 text-white font-bold text-sm shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bookmark"></i> เก็บไว้
                </button>
            </div>

            <!-- Action Buttons for DbD Wheel Mode -->
            <div id="modal-dbd-actions" class="mt-6 flex justify-center">
                <button onclick="closeModal()" 
                    class="w-full py-3 px-6 rounded-xl bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-500 hover:to-rose-600 text-white font-bold text-sm shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i> ตกลง
                </button>
            </div>

        </div>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // ฟังก์ชันสลับตำแหน่งข้อมูลในอาร์เรย์แบบสุ่ม (วางไว้บนสุดของแท็ก script)
        /* Helper function to generate SVG Data URLs for Killers so images ALWAYS load 100% */
        function createKillerSvgDataUrl(code, name, bg1='#3b0764', bg2='#991b1b') {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
                <defs>
                    <linearGradient id="grad_${code}" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="${bg1}" />
                        <stop offset="100%" stop-color="${bg2}" />
                    </linearGradient>
                </defs>
                <rect width="200" height="200" fill="url(#grad_${code})" />
                <circle cx="100" cy="85" r="45" fill="#0f172a" stroke="#ff2a5f" stroke-width="4" opacity="0.8"/>
                <path d="M 60 170 Q 100 130 140 170 Z" fill="#0f172a" opacity="0.8"/>
                <text x="100" y="95" font-family="Prompt, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" drop-shadow="0 2px 4px rgba(0,0,0,0.8)">${code}</text>
                <text x="100" y="165" font-family="Prompt, sans-serif" font-weight="700" font-size="14" fill="#ffb3c1" text-anchor="middle">${name.replace('The ', '')}</text>
            </svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        /* -------------------------------------------------------------
           1. DBD KILLERS DATA (FULL 45 ITEMS MATCHING CONTEXT)
           ------------------------------------------------------------- */
        // ตัวอย่างการตั้งค่าอาร์เรย์ killers ใน index.html
// วางชุดข้อมูลนี้ไว้ในแท็ก <script> ของไฟล์ index.html

  { id: "Demogorgon", name: "The Demogorgon", file: "images/17.webp" },

  { id: "Deathslinger", name: "The Deathslinger", file: "images/19.webp" },
  { id: "Executioner", name: "The Executioner", file: "images/20.webp" },
  { id: "Blight", name: "The Blight", file: "images/21.webp" },

  { id: "Unknown", name: "The Unknown", file: "images/35.jpg" },

  { id: "DarkLord", name: "The Dark Lord", file: "images/37.webp" },
  { id: "Houndmaster", name: "The Houndmaster", file: "images/38.webp" },
  { id: "Ghoul", name: "The Ghoul", file: "images/39.webp" },
  { id: "Animatronic", name: "The Animatronic", file: "images/40.webp" },
  { id: "Krasue", name: "The Krasue", file: "images/41.webp" },
  { id: "First", name: "The First", file: "images/42.png" },
  { id: "Slasher", name: "The Slasher", file: "images/43.png" },
  { id: "Judgment", name: "The Judgment", file: "images/44.png" },
  { id: "Terrifier", name: "The Terrifier", file: "images/45.png" }
];
        /* Vibrant Dark Palette */
        const COLOR_PALETTE = [
            '#1a103c', '#112233', '#2d1235', '#162b32', '#2c161c',
            '#1f1340', '#122620', '#321422', '#1b1b2f', '#251638',
            '#10202b', '#2d1b2d', '#182430', '#301818', '#1a2238'
        ];

        /* -------------------------------------------------------------
           2. GLOBAL STATE VARIABLES
           ------------------------------------------------------------- */
        let currentTab = 'custom'; // 'custom' | 'dbd'
        
        // Custom Wheel State
        let customItems = [];
        let customAngle = 0;
        let isCustomSpinning = false;
        let lastSelectedCustomIndex = -1;

        // DbD Wheel State
        let dbdAngle = 0;
        let isDbdSpinning = false;
        let dbdCenterInterval = null;

        /* -------------------------------------------------------------
           3. INITIALIZATION & TAB SWITCHING
           ------------------------------------------------------------- */
        window.onload = function() {
            // Setup Textarea
            document.getElementById('custom-items-input').value = customItems.join('\n');
            
            // Set initial center portrait
            document.getElementById('dbd-center-portrait').src = DBD_KILLERS[0].file;

            // Render DbD List UI
            renderDbdKillerGrid(DBD_KILLERS);

            // Draw Initial Canvas Wheels
            drawCustomWheel();
            drawDbdWheel();

            // Handle Resize
            window.addEventListener('resize', () => {
                drawCustomWheel();
                drawDbdWheel();
            });
        };

        function switchTab(tab) {
            currentTab = tab;
            const customTabEl = document.getElementById('tab-custom');
            const dbdTabEl = document.getElementById('tab-[#tab-dbd]') || document.getElementById('tab-dbd');
            const customBtn = document.getElementById('tab-custom-btn');
            const dbdBtn = document.getElementById('tab-dbd-btn');

            if (tab === 'custom') {
                customTabEl.classList.remove('hidden');
                dbdTabEl.classList.add('hidden');
                
                customBtn.className = "flex-1 sm:flex-none px-5 py-2 rounded-lg font-semibold text-sm transition-all duration-300 flex items-center justify-center gap-2 bg-[#00e5ff] text-gray-900 shadow-lg font-bold";
                dbdBtn.className = "flex-1 sm:flex-none px-5 py-2 rounded-lg font-semibold text-sm text-gray-400 hover:text-white transition-all duration-300 flex items-center justify-center gap-2";
                
                setTimeout(drawCustomWheel, 50);
            } else {
                customTabEl.classList.add('hidden');
                dbdTabEl.classList.remove('hidden');

                customBtn.className = "flex-1 sm:flex-none px-5 py-2 rounded-lg font-semibold text-sm text-gray-400 hover:text-white transition-all duration-300 flex items-center justify-center gap-2";
                dbdBtn.className = "flex-1 sm:flex-none px-5 py-2 rounded-lg font-semibold text-sm transition-all duration-300 flex items-center justify-center gap-2 bg-[#ff2a5f] text-white shadow-lg font-bold";
                
                setTimeout(drawDbdWheel, 50);
            }
        }

        /* -------------------------------------------------------------
           4. CUSTOM WHEEL ENGINE
           ------------------------------------------------------------- */
        function updateCustomWheelFromTextarea() {
            const text = document.getElementById('custom-items-input').value;
            customItems = text.split('\n').map(item => item.trim()).filter(item => item.length > 0);
            document.getElementById('custom-count-text').innerText = customItems.length;
            drawCustomWheel();
        }

        function resetCustomPresets() {
            customItems = ["แมกซ", "ปอน", "ตี๋", "ซัน", "ตั๋ง",];
            document.getElementById('custom-items-input').value = customItems.join('\n');
            updateCustomWheelFromTextarea();
        }

        function clearCustomList() {
            customItems = [];
            document.getElementById('custom-items-input').value = '';
            updateCustomWheelFromTextarea();
        }

        // ตัวแปรเก็บชุดสีประจำรอบของวงล้อหน้าแรก เพื่อป้องกันสีสลับกระพริบตอนหมุน
        let customWheelColors = [];

        function drawCustomWheel() {
            const canvas = document.getElementById('customCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            // Set High DPI resolution
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            
            const numItems = customItems.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 20;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (numItems === 0) {
                // Empty State
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#1e202e';
                ctx.fill();
                ctx.strokeStyle = '#2d3142';
                ctx.lineWidth = 8;
                ctx.stroke();

                ctx.fillStyle = '#6b7280';
                ctx.font = 'bold 28px Prompt';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('โปรดเพิ่มรายชื่อ...', centerX, centerY);
                return;
            }

            // ถ้าจำนวนช่องเปลี่ยน หรือยังไม่มีชุดสี ให้สุ่มสร้างสีใหม่เก็บไว้ครั้งเดียว
            if (!customWheelColors || customWheelColors.length !== numItems) {
                customWheelColors = customItems.map(() => COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)]);
            }

            const arcSize = (2 * Math.PI) / numItems;

            for (let i = 0; i < numItems; i++) {
                const startAngle = customAngle + i * arcSize;
                const endAngle = startAngle + arcSize;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                
                // ใช้สีจากอาเรย์ที่ล็อกไว้ ไม่สุ่มสดทุกเฟรม
                ctx.fillStyle = customWheelColors[i];
                ctx.fill();

                // Slice Border
                ctx.strokeStyle = '#12141c';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 60px Prompt';
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 6;
                
                // Truncate text if too long
                let text = customItems[i];
                if (text.length > 14) text = text.substring(0, 12) + '..';
                
                ctx.fillText(text, radius - 30, 8);
                ctx.restore();
            }

            // Outer Glow Ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 6;
            ctx.stroke();
        }

        function spinCustomWheel() {
            if (isCustomSpinning) return;
            if (customItems.length === 0) {
                alert('มึงก็ใส่ชื่อก่อนดิวะ');
                return;
            }

            isCustomSpinning = true;
            document.getElementById('spin-custom-btn').disabled = true;

            const duration = 4000 + Math.random() * 2000; // 4 - 6 seconds
            const startTimestamp = performance.now();
            const initialAngle = customAngle;
            // Total rotations + random offset
            const spins = Math.floor(Math.random() * 5) + 10; // จำนวนรอบหมุนเต็มๆ
            const randomOffset = Math.random() * 2 * Math.PI;  // เพิ่มเศษมุมสุ่มแบบอิสระ
            const totalRotation = (spins * 2 * Math.PI) + randomOffset;

            function animate(now) {
                const elapsed = now - startTimestamp;
                const progress = Math.min(elapsed / duration, 1);
                
                // Cubic Ease Out
                const easeOut = 1 - Math.pow(1 - progress, 3);
                customAngle = initialAngle + totalRotation * easeOut;

                drawCustomWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isCustomSpinning = false;
                    document.getElementById('spin-custom-btn').disabled = false;
                    calculateCustomWinner();
                }
            }

            requestAnimationFrame(animate);
        }

        function calculateCustomWinner() {
            const numItems = customItems.length;
            const arcSize = (2 * Math.PI) / numItems;
            
            // Pointer is at Top (3 * Math.PI / 2 radians or 270 degrees)
            const normalizedAngle = (customAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
            let pointerAngle = (3 * Math.PI / 2 - normalizedAngle) % (2 * Math.PI);
            if (pointerAngle < 0) pointerAngle += 2 * Math.PI;

            lastSelectedCustomIndex = Math.floor(pointerAngle / arcSize) % numItems;
            const winningText = customItems[lastSelectedCustomIndex];

            // Trigger Confetti
            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });

            // Show Result Modal
            showModal({
                title: 'ผลการสุ่ม',
                subtitle: '',
                winnerName: winningText,
                isDbd: false,
                imageUrl: null
            });
        }

        function handleModalRemoveChoice(remove) {
            if (remove && lastSelectedCustomIndex !== -1 && lastSelectedCustomIndex < customItems.length) {
                customItems.splice(lastSelectedCustomIndex, 1);
                document.getElementById('custom-items-input').value = customItems.join('\n');
                updateCustomWheelFromTextarea();
            }
            closeModal();
        }

        /* -------------------------------------------------------------
           5. DBD KILLERS WHEEL ENGINE (45 KILLERS)
           ------------------------------------------------------------- */
        function drawDbdWheel() {
            const canvas = document.getElementById('dbdCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            
            const numItems = DBD_KILLERS.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 20;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const arcSize = (2 * Math.PI) / numItems;

            for (let i = 0; i < numItems; i++) {
                const startAngle = dbdAngle + i * arcSize;
                const endAngle = startAngle + arcSize;

                // Alternate dark bloody colors
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = (i % 2 === 0) ? '#240a12' : '#140e1b';
                ctx.fill();

                ctx.strokeStyle = '#42111d';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffb3c1';
                ctx.font = 'bold 15px Prompt';
                
                // Truncate killer name for high density wheel
                let text = DBD_KILLERS[i].name.replace('The ', '');
                ctx.fillText(text, radius - 20, 5);
                ctx.restore();
            }

            // Outer Neon Border
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#ff2a5f';
            ctx.lineWidth = 6;
            ctx.stroke();
        }

        function spinDbdWheel() {
            if (isDbdSpinning) return;

            isDbdSpinning = true;
            document.getElementById('spin-dbd-btn').disabled = true;

            // Start Center Image Rapid Switching Effect
            const centerImgEl = document.getElementById('dbd-center-portrait');
            dbdCenterInterval = setInterval(() => {
                const randomKiller = DBD_KILLERS[Math.floor(Math.random() * DBD_KILLERS.length)];
                centerImgEl.src = randomKiller.file;
            }, 90);

            const duration = 4500 + Math.random() * 2000;
            const startTimestamp = performance.now();
            const initialAngle = dbdAngle;
            const spins = Math.floor(Math.random() * 5) + 12; // จำนวนรอบหมุนเต็มๆ
            const randomOffset = Math.random() * 2 * Math.PI;  // เพิ่มเศษมุมสุ่มแบบอิสระ
            const totalRotation = (spins * 2 * Math.PI) + randomOffset;

            function animate(now) {
                const elapsed = now - startTimestamp;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOut = 1 - Math.pow(1 - progress, 3);
                dbdAngle = initialAngle + totalRotation * easeOut;

                drawDbdWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isDbdSpinning = false;
                    clearInterval(dbdCenterInterval);
                    document.getElementById('spin-dbd-btn').disabled = false;
                    calculateDbdWinner();
                }
            }

            requestAnimationFrame(animate);
        }

        function calculateDbdWinner() {
            const numItems = DBD_KILLERS.length;
            const arcSize = (2 * Math.PI) / numItems;
            
            const normalizedAngle = (dbdAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
            let pointerAngle = (3 * Math.PI / 2 - normalizedAngle) % (2 * Math.PI);
            if (pointerAngle < 0) pointerAngle += 2 * Math.PI;

            const winningIndex = Math.floor(pointerAngle / arcSize) % numItems;
            const winner = DBD_KILLERS[winningIndex];

            // Set Center Portrait to Winner
            document.getElementById('dbd-center-portrait').src = winner.file;

            // Trigger Red Confetti
            confetti({
                particleCount: 100,
                spread: 90,
                origin: { y: 0.6 },
                colors: ['#ff2a5f', '#ff0000', '#ffffff', '#800000']
            });

            // Show Modal Popup
            showModal({
                title: 'KILLER SELECT',
                subtitle: 'ฆาตกรที่ได้คือ',
                winnerName: `${winner.id} - ${winner.name}`,
                isDbd: true,
                imageUrl: winner.file
            });
        }

        /* -------------------------------------------------------------
           6. DBD KILLER DIRECTORY & FILTER UI
           ------------------------------------------------------------- */
        function renderDbdKillerGrid(list) {
            const gridContainer = document.getElementById('dbd-killer-grid');
            gridContainer.innerHTML = '';

            list.forEach(killer => {
                const card = document.createElement('div');
                card.className = "bg-[#161824] p-2 rounded-xl border border-gray-800 hover:border-red-500/50 transition flex items-center gap-2 group cursor-pointer";
                card.onclick = () => {
                    // Preview modal when clicking list item
                    showModal({
                        title: 'Killer',
                        subtitle: killer.id,
                        winnerName: killer.name,
                        isDbd: true,
                        imageUrl: killer.file
                    });
                };

                card.innerHTML = `
                    <img src="${killer.file}" 
                         class="w-10 h-10 object-cover rounded-lg border border-gray-700 group-hover:border-red-500 transition" 
                         alt="${killer.name}">
                    <div class="overflow-hidden">
                        <div class="text-[10px] text-red-400 font-mono font-bold">${killer.id}</div>
                        <div class="text-xs font-semibold text-gray-200 truncate group-hover:text-white">${killer.name}</div>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }

        function filterDbdList() {
            const query = document.getElementById('dbd-search-input').value.toLowerCase();
            const filtered = DBD_KILLERS.filter(k => 
                k.name.toLowerCase().includes(query) || 
                k.id.toLowerCase().includes(query)
            );
            renderDbdKillerGrid(filtered);
        }

        /* -------------------------------------------------------------
           7. MODAL DIALOG CONTROLLER
           ------------------------------------------------------------- */
        function showModal({ title, subtitle, winnerName, isDbd, imageUrl }) {
            const modal = document.getElementById('result-modal');
            const modalCard = document.getElementById('modal-card');
            const titleEl = document.getElementById('modal-title');
            const subtitleEl = document.getElementById('modal-subtitle');
            const winnerNameEl = document.getElementById('modal-winner-name');
            const imgContainer = document.getElementById('modal-image-container');
            const killerImg = document.getElementById('modal-killer-img');
            const customActions = document.getElementById('modal-custom-actions');
            const dbdActions = document.getElementById('modal-dbd-actions');
            const glowEl = document.getElementById('modal-glow');

            titleEl.innerText = title;
            subtitleEl.innerText = subtitle;
            winnerNameEl.innerText = winnerName;

            if (isDbd) {
                imgContainer.classList.remove('hidden');
                imgContainer.classList.add('flex');
                killerImg.src = imageUrl;
                customActions.classList.add('hidden');
                dbdActions.classList.remove('hidden');
                glowEl.className = "absolute -top-20 left-1/2 -translate-x-1/2 w-40 h-40 bg-red-600/30 rounded-full blur-3xl pointer-events-none";
            } else {
                imgContainer.classList.add('hidden');
                imgContainer.classList.remove('flex');
                customActions.classList.remove('hidden');
                dbdActions.classList.add('hidden');
                glowEl.className = "absolute -top-20 left-1/2 -translate-x-1/2 w-40 h-40 bg-cyan-500/30 rounded-full blur-3xl pointer-events-none";
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-90');
            modalCard.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('result-modal');
            const modalCard = document.getElementById('modal-card');

            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }
        // ฟังก์ชันสลับตำแหน่งข้อมูลแบบสุ่ม
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}
// ฟังก์ชันสลับตำแหน่งอาเรย์พื้นฐาน (Fisher-Yates Shuffle)
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// 1. ฟังก์ชันกดสลับตำแหน่งวงล้อหน้าแรก (Custom Wheel)
function shuffleCustomWheel() {
    const textarea = document.querySelector('textarea');
    if (!textarea) {
        alert('ไม่พบช่องกรอกรายชื่อ!');
        return;
    }

    let items = textarea.value.split('\n').map(item => item.trim()).filter(item => item !== '');
    if (items.length === 0) {
        alert('มึงก็ใส่ชื่อก่อนดิวะ');
        return;
    }

    shuffleArray(items);
    textarea.value = items.join('\n');

    if (typeof customItems !== 'undefined') {
        customItems = items;
    }

    // <-- นำบรรทัดนี้มาวางไว้ตรงนี้ เพื่อล้างค่าสีเก่าให้สุ่มใหม่ตอนกดสลับ
    customWheelColors = [];

    const countEl = document.getElementById('custom-count-text') || document.getElementById('count-text');
    if (countEl) {
        countEl.innerText = items.length;
    }

    if (typeof drawCustomWheel === 'function') {
        drawCustomWheel();
    }
}

// 2. ฟังก์ชันกดสลับตำแหน่งวงล้อ DbD Killers (หน้าสอง)
function shuffleDbdWheel() {
    if (typeof DBD_KILLERS === 'undefined' || DBD_KILLERS.length === 0) {
        alert('ไม่พบข้อมูล Killer!');
        return;
    }

    shuffleArray(DBD_KILLERS);

    if (typeof renderDbdKillerGrid === 'function') {
        renderDbdKillerGrid(DBD_KILLERS);
    }

    if (typeof drawDbdWheel === 'function') {
        drawDbdWheel();
    }
}
