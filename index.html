<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Wheel - วงล้อเสี่ยงโชคปรับเรทได้</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #030712;
            background-image: 
                radial-gradient(at 0% 0%, rgba(236, 72, 153, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
            min-height: 100vh;
        }

        /* Neon Glow Button & Elements */
        .neon-button {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .neon-button:hover:not(:disabled) {
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px) scale(1.02);
        }

        .wheel-shadow {
            filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.35));
        }

        /* Pointer / Arrow Indicator */
        .wheel-pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #f43f5e;
            filter: drop-shadow(0 6px 12px rgba(244, 63, 94, 0.6));
            z-index: 30;
        }

        .wheel-pointer::after {
            content: '';
            position: absolute;
            top: -44px;
            left: -12px;
            width: 24px;
            height: 12px;
            background: #9f1239;
            border-radius: 6px;
            box-shadow: 0 0 10px #f43f5e;
        }

        /* Custom Scrollbar for Items List */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between p-4 md:p-8 min-h-screen">

    <!-- Header Section -->
    <header class="text-center mb-6">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-900/80 border border-slate-800 mb-3 text-xs font-semibold text-pink-400 tracking-wider uppercase">
            <span class="w-2 h-2 rounded-full bg-pink-500 animate-ping"></span>
            Weighted Random Wheel Engine
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 drop-shadow-lg tracking-tight">
            🎰 LUCKY WHEEL
        </h1>
        <p class="text-slate-400 text-sm md:text-base mt-2 max-w-xl mx-auto">
            วงล้อเสี่ยงโชคธีมสีดำ ปรับเปลี่ยนอัตราเรทสุ่ม (Weight) และวาดพื้นที่แบ่งตามเปอร์เซ็นต์จริง
        </p>
    </header>

    <!-- Main Grid Content -->
    <main class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start mb-8">

        <!-- Left Column: Canvas Wheel Display -->
        <section class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-2xl border border-slate-800/80 p-6 md:p-8 rounded-3xl shadow-2xl relative">

            <!-- Pointer & Wheel Container -->
            <div class="wheel-shadow relative w-full max-w-[460px] aspect-square flex justify-center items-center my-4">
                <div class="wheel-pointer"></div>
                <!-- Wheel Canvas -->
                <canvas id="wheelCanvas" width="460" height="460" class="w-full h-full rounded-full cursor-pointer"></canvas>
            </div>

            <!-- Action Controls -->
            <div class="mt-6 flex flex-col sm:flex-row gap-4 w-full justify-center items-center max-w-md">
                <button id="spinBtn" onclick="spinWheel()" class="neon-button w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 hover:from-pink-500 hover:to-indigo-500 text-white font-extrabold text-xl rounded-2xl transition-all duration-300 flex items-center justify-center gap-3 active:scale-95">
                    <i class="fa-solid fa-play text-pink-200"></i> หมุนวงล้อ!
                </button>
                <button onclick="shuffleItems()" class="w-full sm:w-auto px-6 py-4 bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold text-base rounded-2xl transition border border-slate-800 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-shuffle text-purple-400"></i> สลับตำแหน่ง
                </button>
            </div>
        </section>

        <!-- Right Column: Control Panel & Rate Management -->
        <section class="lg:col-span-5 flex flex-col bg-slate-950/80 backdrop-blur-2xl border border-slate-800/80 p-6 rounded-3xl shadow-2xl h-full">

            <div class="flex justify-between items-center mb-5 pb-4 border-b border-slate-800">
                <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2.5">
                    <i class="fa-solid fa-sliders text-pink-500"></i> จัดการรายการ & เรทสุ่ม
                </h2>
                <span id="totalWeightBadge" class="text-xs font-bold bg-pink-950/60 text-pink-300 px-3 py-1.5 rounded-full border border-pink-800/50">
                    น้ำหนักรวม: 0
                </span>
            </div>

            <!-- Form: Add Item -->
            <form id="addItemForm" onsubmit="addNewItem(event)" class="flex gap-2 mb-5">
                <input type="text" id="newItemName" placeholder="ชื่อรางวัล / รายการ..." required 
                    class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-pink-500 transition">
                <input type="number" id="newItemWeight" placeholder="น้ำหนัก" min="1" max="1000" value="1" required 
                    class="w-20 bg-slate-900 border border-slate-800 rounded-xl px-3 py-3 text-sm text-slate-100 text-center font-bold focus:outline-none focus:border-pink-500 transition">
                <button type="submit" class="bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-semibold px-4 py-3 rounded-xl transition text-sm flex items-center gap-1.5 shrink-0 shadow-lg">
                    <i class="fa-solid fa-plus"></i> เพิ่ม
                </button>
            </form>

            <!-- Items List Container -->
            <div id="itemsContainer" class="flex-1 overflow-y-auto max-h-[360px] pr-1 space-y-2.5">
                <!-- Items list rendered dynamically -->
            </div>

            <!-- Presets & Reset -->
            <div class="mt-6 pt-4 border-t border-slate-800 flex flex-wrap gap-2 justify-between items-center text-xs">
                <div class="flex gap-2">
                    <button onclick="loadPreset('default')" class="px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-xl border border-slate-800 transition">ตัวอย่างทั่วไป</button>
                    <button onclick="loadPreset('gacha')" class="px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-800 transition">เรทกาชา (SSR/เกลือ)</button>
                </div>
                <button onclick="clearAllItems()" class="px-3 py-2 bg-red-950/40 hover:bg-red-900/60 text-red-300 rounded-xl transition border border-red-900/50">
                    <i class="fa-solid fa-trash-can"></i> ลบทั้งหมด
                </button>
            </div>
        </section>

    </main>

    <!-- Modal Notification Result -->
    <div id="resultModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-950 border border-slate-800 rounded-3xl p-8 max-w-sm w-full mx-4 text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="w-20 h-20 bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400 rounded-full flex items-center justify-center mx-auto mb-5 shadow-xl shadow-pink-500/20">
                <i class="fa-solid fa-trophy text-4xl text-white"></i>
            </div>
            <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">ผลการสุ่มของคุณ</h3>
            <p id="winnerResultText" class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-300 my-3 break-words">
                -
            </p>
            <p id="winnerProbabilityText" class="text-xs text-slate-500 mb-6">
                โอกาสสุ่มได้: 0%
            </p>
            <button onclick="closeModal()" class="w-full py-3.5 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold rounded-xl transition shadow-lg shadow-pink-600/30">
                ตกลง
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Preset Color Palette for Segments
        const colorPalette = [
            '#ef4444', '#f97316', '#f59e0b', '#10b981', 
            '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', 
            '#ec4899', '#f43f5e', '#14b8a6', '#84cc16'
        ];

        // Initial Data Items (Name, Weight/Rate, Color)
        let items = [
            { id: 1, name: 'รางวัลใหญ่ 🎁', weight: 1, color: '#f59e0b' },
            { id: 2, name: 'ส่วนลด 50%', weight: 3, color: '#ec4899' },
            { id: 3, name: 'ส่วนลด 20%', weight: 5, color: '#8b5cf6' },
            { id: 4, name: 'ส่วนลด 10%', weight: 10, color: '#3b82f6' },
            { id: 5, name: 'แก้วน้ำพรีเมียม', weight: 4, color: '#10b981' },
            { id: 6, name: 'ขอบคุณที่ร่วมสนุก 😅', weight: 15, color: '#64748b' }
        ];

        // Canvas & Wheel Logic Variables
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let isSpinning = false;
        let currentRotation = 0; // Current angle in radians

        // Web Audio API Context for sound effects
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Sound effect: Tick sound during spin
        function playTickSound() {
            try {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) { console.error(e); }
        }

        // Sound effect: Win Fanfare
        function playWinSound() {
            try {
                if (!audioCtx) return;
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.1);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * 0.1);
                    osc.stop(audioCtx.currentTime + index * 0.1 + 0.35);
                });
            } catch (e) { console.error(e); }
        }

        // Get total weight sum
        function getTotalWeight() {
            return items.reduce((sum, item) => sum + item.weight, 0);
        }

        // Render Canvas Wheel based on Item Weights
        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 15;

            ctx.clearRect(0, 0, width, height);

            const totalWeight = getTotalWeight();
            if (items.length === 0 || totalWeight === 0) {
                // Empty wheel state
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#090d16';
                ctx.fill();
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 18px Kanit';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('กรุณาเพิ่มรายการ', centerX, centerY);
                return;
            }

            let startAngle = currentRotation;

            items.forEach((item) => {
                // Segment angle proportional to weight
                const sliceAngle = (item.weight / totalWeight) * (2 * Math.PI);
                const endAngle = startAngle + sliceAngle;

                // Draw Segment Wedge
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.strokeStyle = '#030712';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Draw Text inside segment
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = 4;

                const fontSize = Math.max(12, Math.min(18, Math.floor(sliceAngle * 40)));
                ctx.font = `bold ${fontSize}px Kanit`;

                let label = item.name;
                if (label.length > 14) label = label.substring(0, 12) + '...';

                ctx.fillText(label, radius - 25, 0);
                ctx.restore();

                startAngle = endAngle;
            });

            // Outer Frame Circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#f43f5e';
            ctx.stroke();

            // Center Pin Circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
            ctx.fillStyle = '#090d16';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Inner Center Accent Glow
            ctx.beginPath();
            ctx.arc(centerX, centerY, 12, 0, 2 * Math.PI);
            ctx.fillStyle = '#ec4899';
            ctx.fill();
        }

        // Weighted Random Algorithm Selection
        function pickWeightedWinner() {
            const totalWeight = getTotalWeight();
            let randomNum = Math.random() * totalWeight;

            for (let i = 0; i < items.length; i++) {
                if (randomNum < items[i].weight) {
                    return i;
                }
                randomNum -= items[i].weight;
            }
            return items.length - 1;
        }

        // Spin Logic with Physics Ease-Out
        function spinWheel() {
            if (isSpinning) return;
            if (items.length < 2) {
                alert('กรุณาเพิ่มอย่างน้อย 2 รายการเพื่อหมุนวงล้อ');
                return;
            }

            initAudio();
            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const winnerIndex = pickWeightedWinner();
            const totalWeight = getTotalWeight();

            // Calculate exact target angle for top pointer (270 deg or 1.5 * Math.PI)
            let cumulativeWeight = 0;
            for (let i = 0; i < winnerIndex; i++) {
                cumulativeWeight += items[i].weight;
            }

            const winnerWeight = items[winnerIndex].weight;
            const startWeightAngle = (cumulativeWeight / totalWeight) * (2 * Math.PI);
            const sliceWeightAngle = (winnerWeight / totalWeight) * (2 * Math.PI);

            const randomInnerSliceAngle = startWeightAngle + (0.1 + Math.random() * 0.8) * sliceWeightAngle;

            const pointerAngle = 1.5 * Math.PI; // Top Center Pointer
            const currentMod = currentRotation % (2 * Math.PI);
            
            const extraRounds = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
            const targetRotation = currentRotation + extraRounds + (pointerAngle - (currentMod + randomInnerSliceAngle) % (2 * Math.PI));

            const spinDuration = 5500;
            const startTime = performance.now();
            const initialRotation = currentRotation;
            let lastSoundSegment = -1;

            function animateSpin(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);

                // Ease-Out curve for slowdown
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentRotation = initialRotation + (targetRotation - initialRotation) * easeOut;

                const currentSegment = Math.floor((currentRotation % (2 * Math.PI)) / (Math.PI / 6));
                if (currentSegment !== lastSoundSegment) {
                    playTickSound();
                    lastSoundSegment = currentSegment;
                }

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                    showWinner(items[winnerIndex]);
                }
            }

            requestAnimationFrame(animateSpin);
        }

        // Display Winner Modal & Confetti
        function showWinner(item) {
            playWinSound();

            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 }
            });

            const totalWeight = getTotalWeight();
            const probability = ((item.weight / totalWeight) * 100).toFixed(1);

            document.getElementById('winnerResultText').innerText = item.name;
            document.getElementById('winnerProbabilityText').innerText = `โอกาสสุ่มได้: ${probability}% (น้ำหนัก ${item.weight}/${totalWeight})`;

            const modal = document.getElementById('resultModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('resultModal');
            const modalContent = document.getElementById('modalContent');

            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Item List Management
        function renderItemsList() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            const totalWeight = getTotalWeight();
            document.getElementById('totalWeightBadge').innerText = `น้ำหนักรวม: ${totalWeight}`;

            items.forEach((item, index) => {
                const percent = totalWeight > 0 ? ((item.weight / totalWeight) * 100).toFixed(1) : 0;
                
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-slate-900/90 border border-slate-800/80 p-3 rounded-2xl gap-3 transition hover:border-slate-700';
                div.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 min-w-0">
                        <input type="color" value="${item.color}" onchange="updateItemColor(${index}, this.value)" 
                            class="w-6 h-6 rounded-lg cursor-pointer border-0 bg-transparent shrink-0">
                        <input type="text" value="${item.name}" onchange="updateItemName(${index}, this.value)" 
                            class="bg-transparent border-b border-transparent hover:border-slate-600 focus:border-pink-500 text-sm font-medium text-slate-200 focus:outline-none w-full truncate px-1">
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                        <div class="flex items-center gap-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1">
                            <span class="text-xs text-slate-500 font-medium">Weight:</span>
                            <input type="number" value="${item.weight}" min="1" max="1000" onchange="updateItemWeight(${index}, this.value)"
                                class="w-12 bg-transparent text-center text-xs font-bold text-pink-400 focus:outline-none">
                        </div>
                        <span class="text-xs font-semibold text-slate-400 w-12 text-right">${percent}%</span>
                        <button onclick="removeItem(${index})" class="text-slate-500 hover:text-red-400 p-1 transition">
                            <i class="fa-solid fa-xmark text-base"></i>
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });

            drawWheel();
        }

        function addNewItem(e) {
            e.preventDefault();
            const nameInput = document.getElementById('newItemName');
            const weightInput = document.getElementById('newItemWeight');

            const name = nameInput.value.trim();
            const weight = parseInt(weightInput.value) || 1;
            const color = colorPalette[items.length % colorPalette.length];

            if (name) {
                items.push({ id: Date.now(), name, weight, color });
                nameInput.value = '';
                weightInput.value = '1';
                renderItemsList();
            }
        }

        function updateItemName(index, newName) {
            if (newName.trim()) {
                items[index].name = newName.trim();
                drawWheel();
            }
        }

        function updateItemWeight(index, newWeight) {
            const weight = parseInt(newWeight);
            if (weight > 0) {
                items[index].weight = weight;
                renderItemsList();
            }
        }

        function updateItemColor(index, newColor) {
            items[index].color = newColor;
            drawWheel();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderItemsList();
        }

        function clearAllItems() {
            if (confirm('คุณต้องการลบรายการทั้งหมดหรือไม่?')) {
                items = [];
                renderItemsList();
            }
        }

        function shuffleItems() {
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            renderItemsList();
        }

        function loadPreset(type) {
            if (type === 'default') {
                items = [
                    { id: 1, name: 'รางวัลใหญ่ 🎁', weight: 1, color: '#f59e0b' },
                    { id: 2, name: 'ส่วนลด 50%', weight: 3, color: '#ec4899' },
                    { id: 3, name: 'ส่วนลด 20%', weight: 5, color: '#8b5cf6' },
                    { id: 4, name: 'ส่วนลด 10%', weight: 10, color: '#3b82f6' },
                    { id: 5, name: 'แก้วน้ำพรีเมียม', weight: 4, color: '#10b981' },
